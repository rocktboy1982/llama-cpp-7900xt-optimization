# TabbyAPI (ExLlamaV3-ROCm): Qwen3.8-27B EXL3 3.5 bpw + DFlash2 draft model on an RX 7900 XT (20 GB, gfx1100).
# Tested 2026-10-05: 98,304-token context, 8-bit KV cache (draft KV 4-bit) peaks at 19.7 of 19.98 GiB.
# Network is open on 0.0.0.0 with API-key auth ON; use 127.0.0.1 if no other machine needs access. See docs/tabbyapi-guide.md.
network:
  host: 0.0.0.0
  port: 11437
  # Keep auth on when the port is reachable from other machines; TabbyAPI writes api_tokens.yml on first start
  disable_auth: false
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false

model:
  model_dir: models
  model_name: Qwen3.8-27B-EXL3-3.5bpw
  backend: exllamav3
  max_seq_len: 98304
  cache_size: 98304
  cache_mode: Q8
  gpu_split_auto: true
  autosplit_reserve: [512]
  chunk_size: 2048
  max_batch_size: 1
  vision: true
  vision_offload: true
  reasoning: true
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
  tool_format: qwen3_coder

draft_model:
  draft_mode: model
  draft_model_dir: models
  draft_model_name: Qwen3.8-27B-DFlash2-EXL3-5.0bpw
  draft_cache_mode: Q4

memory:
  sysmem_recurrent_cache: 4096
